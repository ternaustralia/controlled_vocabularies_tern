# Registry of ConceptScheme workflows.
#
# Example structure:
#
# schemes:
#   - id: example_scheme              # Optional friendly identifier
#     name: Example Concept Scheme    # Optional descriptive label
#     endpoint: https://example.org/sparql
#     concept_scheme: https://example.org/concept-scheme
#     validators:
#       - shapes/scheme-basics.ttl
#       - shapes/example-custom.ttl
#
# The baseline validator specified via the Makefile (defaults to
# shapes/scheme-basics.ttl) is always included automatically, so only list
# additional files when you need extra constraints.

